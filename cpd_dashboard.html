<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPD Pendency Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== base ===== */
:root{--bg:#eef2f9;--card:#fff;--tx:#141b2d;--mut:#6a7690;--bd:#e3e8f2;--pri:#2457d6;--red:#e03a3a;--grn:#12a15b;--navy:#1d2c5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.bar select,.bar input{border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;background:#fff;color:var(--tx)}
.bar input{min-width:230px;font-weight:400}
#fd{background:#e6f7ef;border-color:#a9e3c8;color:#0b7a46;border-radius:22px}
.bar button{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font:inherit}
.meta{margin-left:auto;color:var(--mut);font-size:12px}
main{padding:16px 18px 30px}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(30,50,90,.07);padding:16px;position:relative}
.card.flat{padding:14px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.sec{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:17px;font-weight:800}
.sec:before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(#4f7cff,#27c4f5)}
h3.t{margin:0 0 10px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
canvas{max-height:290px}
ul.ins{margin:0;padding-left:18px}ul.ins li{margin:5px 0}
/* ===== metric cards ===== */
.om,.sc{border-left:5px solid var(--c);padding:14px 16px;overflow:visible}
.om .hd,.sc .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.om .hd i,.sc .hd i{font-style:normal;background:#eef2f9;border-radius:8px;padding:3px 10px;font-size:11px}
.om .big{font-size:30px;font-weight:800;margin:4px 0 8px}
.om .box{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:#fafbfe}
.om .box>div{display:flex;justify-content:space-between;padding:3px 0}.om .box span{color:var(--mut)}
.om hr{border:0;border-top:1px dashed var(--bd);margin:6px 0}
.dl{font-weight:800}.up{color:var(--red)}.dn{color:var(--grn)}.fl{color:var(--mut)}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;padding:4px 8px;text-align:right;border-bottom:1px solid var(--bd)}
table.st td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;font-variant-numeric:tabular-nums}
table.st th.l,table.st td.l{text-align:left}
table.st tr.all td{font-weight:800;font-size:15px;background:#f3f6fc}
table.st tr:last-child td{border-bottom:0}
/* ===== KPI + Day Start ===== */
.k{border-top:4px solid var(--c);padding:14px 16px;overflow:hidden}
.k:after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:var(--cb)}
.k .ic{width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.k .l{font-weight:700;font-size:13px}.k .v{font-size:25px;font-weight:800}.k .s{color:var(--mut);font-size:12px}
.ds{border-left:6px solid #2d4fd0;padding:0;overflow:hidden}
.dsh{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:16px}
.dsh .ico{width:48px;height:48px;border-radius:14px;background:#2d4fd0;display:grid;place-items:center;font-size:22px}
.dsh .n{font-size:30px;font-weight:800}.dsh small{color:var(--mut);display:block}
.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#12a15b calc(var(--p)*1%),#e3e8f2 0)}
.ring b{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px}
.chips{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);border-radius:12px;padding:8px 14px;font-weight:700;background:#f2f5fc}.chip b{color:var(--pri);margin-left:6px;font-size:16px}
.pbar{height:6px;background:#e3e8f2;margin:0 16px;border-radius:3px;overflow:hidden}.pbar div{height:100%;background:#12a15b}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:14px 16px 16px}
.pn>div{border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.pn h4{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:#e7ecf8}
.pn div:nth-child(2n) h4{background:#ece6f8}.pn div:nth-child(3n) h4{background:#f6ece3}
.pn p{margin:0;padding:7px 12px;display:flex;justify-content:space-between;border-top:1px solid var(--bd)}
.pn p span{color:var(--mut)}.pn p b{font-size:15px}
/* ===== tools / pills ===== */
.tools{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap;align-items:center}
.tools button,.tools select{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.tools button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-weight:700;font-size:12px}
.pill.up{background:#fde8e8;color:#c42a2a}.pill.dn{background:#e1f6ec;color:#0c8a4c}.pill.fl{background:#eef1f7;color:var(--mut)}
/* ===== data tables (RM / AM / Hub / trails) ===== */
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:stretch}
.sumrow>div{background:linear-gradient(135deg,#f4f7ff,#eaf0ff);border:1px solid #dbe4fb;border-radius:12px;padding:8px 16px;min-width:110px}
.sumrow small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.sumrow b{font-size:20px}.sumrow .gd b{color:#0c8a4c}
.xbtn{margin-left:auto;align-self:center;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(36,87,214,.28)}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--bd);border-radius:14px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap;font-variant-numeric:tabular-nums}
.dt th,.dt td{padding:9px 12px;text-align:right;border-bottom:1px solid #edf0f7}
.dt thead th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;z-index:3}
.dt thead tr.gr th{height:30px;padding-top:6px;padding-bottom:6px;background:#2d4fd0;font-size:10px;letter-spacing:.12em;text-align:center;border-left:1px solid rgba(255,255,255,.25);cursor:default}
.dt thead tr:nth-child(2) th{top:30px}
.dt thead th:hover{background:#2d4fd0}
.dt .l,.dt th.l{text-align:left}
.dt tbody tr:nth-child(even){background:#f8faff}.dt tbody tr:nth-child(odd){background:#fff}
.dt tbody tr:hover{background:#e9f0ff}
.dt.lv td:nth-child(1),.dt.lv td:nth-child(2){background:inherit;position:sticky;left:0;z-index:1}
.dt:not(.lv) td:first-child{background:inherit;position:sticky;left:0;z-index:1}
.dt:not(.lv) th:first-child{position:sticky;left:0;z-index:4}
.dt.lv td:nth-child(2){left:44px;box-shadow:2px 0 4px -2px rgba(30,50,90,.15)}
.dt.lv th:nth-child(1){position:sticky;left:0;z-index:4;width:44px;min-width:44px}
.dt.lv th:nth-child(2){position:sticky;left:44px;z-index:4}
.dt tfoot td{position:sticky;bottom:0;background:#e6edfb;font-weight:800;border-top:2px solid #c9d6f5;z-index:2}
.dt tfoot td:first-child{z-index:3}
.rkn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#eef2fb;color:var(--mut);font-size:12px;font-weight:700}
tr:nth-child(-n+3) .rkn{background:#fde9b8;color:#8a5a00}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:700;display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--mut);font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.z{color:#c3cad8}
td.gd{color:#0c8a4c;font-weight:700}td.rd{color:#c42a2a;font-weight:700}
.tbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.tbar span{width:70px;height:7px;background:#e3e8f2;border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#4f7cff,#27c4f5)}
.pb{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pb>div{width:64px;height:7px;background:#e3e8f2;border-radius:4px;overflow:hidden}
.pb i{display:block;height:100%}.pb b{min-width:44px;text-align:right}
td.hc{font-weight:600}
.note{color:var(--mut);padding:8px 2px;font-size:12px}


/* ===== scope pills + tabs ===== */
.pills{padding:16px 18px 0}
.seg{display:inline-flex;gap:6px;background:#fff;border-radius:999px;padding:6px;box-shadow:0 4px 18px rgba(30,50,90,.10);border:1px solid var(--bd)}
.seg button{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:999px;padding:9px 20px;font:inherit;font-weight:800;color:var(--mut);cursor:pointer;transition:all .18s}
.seg button:hover{background:#f1f5ff;color:var(--pri)}
.seg button .ico{font-size:16px}
.seg button em{font-style:normal;font-size:11px;font-weight:800;background:#eef2fb;color:var(--mut);border-radius:999px;padding:2px 9px}
.seg button.on{background:linear-gradient(135deg,#2457d6,#2fa8f5);color:#fff;box-shadow:0 6px 16px rgba(36,87,214,.38)}
.seg button.on em{background:rgba(255,255,255,.25);color:#fff}
.subs{display:flex;gap:4px;margin:14px 18px 0;padding:6px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(30,50,90,.07);overflow-x:auto}
.subs button{display:flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap;transition:all .18s;position:relative}
.subs button:hover{background:#f3f6ff;color:var(--pri)}
.subs button .ico{font-size:15px}
.subs button.on{background:linear-gradient(135deg,#e8efff,#dbe7ff);color:var(--pri);box-shadow:inset 0 0 0 1px #c5d6fb}
.subs button.on:after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:3px;border-radius:3px;background:var(--pri)}
/* ===== oval status chips ===== */
.hb{display:inline-block;min-width:78px;padding:5px 16px;border-radius:999px;border:1px solid transparent;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* KPI cards: one row */
.kr{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.kr{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.sumrow .rt b{color:#6d28d9}

/* ===== TID popup ===== */
a.drill{cursor:pointer;display:inline-block;transition:transform .12s}
a.drill:hover{transform:scale(1.07)}
a.drill.tot{color:var(--pri);text-decoration:underline;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;width:min(1050px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px;background:linear-gradient(135deg,#1d2c5e,#2d4fd0);color:#fff}
.mh h2{margin:0;font-size:18px}.mh small{opacity:.85}
.mx{border:0;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.mx:hover{background:rgba(255,255,255,.32)}
.mt{display:flex;gap:10px;align-items:center;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.mt .mc{font-weight:800;color:#c42a2a;background:#fde8e8;border-radius:999px;padding:5px 14px}
.mt input{flex:1;min-width:220px;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit}
.mt .xbtn{margin-left:0}
.mb{overflow:auto;padding:0 20px 16px;flex:1}
.mb .dt thead th{top:0}
.mmsg{padding:30px 10px;text-align:center;color:var(--mut)}

/* ===== hub bucket card ===== */
.sc .hd select{border:1px solid var(--bd);border-radius:8px;padding:2px 8px;font:inherit;font-size:11px;font-weight:700;text-transform:none;letter-spacing:0;background:#fff;color:var(--tx);cursor:pointer}
a.drill.bk{color:var(--pri);text-decoration:underline;font-weight:800}

</style></head><body>

<main id="main"></main>

async function openTids(lvl,key){

 const s=cur(),name=key<0?'All '+{rm:'RMs',am:'AMs',hub:'Hubs',partner:'Partners'}[lvl]:NM[lvl](key);
 const sub=`${SCL[S.scope]} · ${dfmt(S.date)} @ ${s.t}`;
 const close=()=>{mo.className='modal';mo.innerHTML='';document.removeEventListener('keydown',onEsc)};
 const onEsc=e=>{if(e.key==='Escape')close()};
 const shell=body=>{mo.className='modal on';mo.innerHTML=`<div class="mbox"><div class="mh"><div><h2>Final Pending TIDs · ${hesc(name)}</h2><small>${sub}</small></div><button class="mx" id="mclose">✕</button></div>${body}</div>`;$('mclose').onclick=close;mo.onclick=e=>{if(e.target===mo)close()}};
 document.addEventListener('keydown',onEsc);
 shell('<div class="mb"><p class="mmsg">Loading TID list…</p></div>');
 let d;try{d=await loadTids(s.k)}catch(e){shell('<div class="mb"><p class="mmsg">TID list not found for this snapshot.<br>Run <b>build_cpd_dashboard.py</b> again and keep the <b>cpd_tids</b> folder next to this HTML file.</p></div>');return}
 const rows=tidRows(d,lvl,key);let cf=rows;
 shell(`<div class="mt"><span class="mc" id="mcnt"></span><input id="mq" placeholder="Search TID / RM / AM / Hub / Partner / Date…"><button class="xbtn" id="mx2">⬇ Export CSV</button></div><div class="mb" id="mtb"></div>`);
 const draw=q=>{const f=q?rows.filter(r=>r.some(v=>String(v).toLowerCase().includes(q))):rows,lim=2000;
  $('mtb').innerHTML=`<table class="dt"><thead><tr><th class="l">#</th><th class="l">TID</th><th class="l">RM</th><th class="l">AM</th><th class="l">Hub</th><th class="l">Partner</th><th class="l">Date</th></tr></thead><tbody>${f.slice(0,lim).map((r,i)=>`<tr><td class="l">${i+1}</td>${r.map(v=>`<td class="l">${hesc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>${f.length>lim?`<div class="note">Showing first ${fmt(lim)} of ${fmt(f.length)} – Export CSV has all rows.</div>`:''}`;
  $('mcnt').textContent=fmt(f.length)+' TIDs pending';return f};
 cf=draw('');$('mq').oninput=e=>{cf=draw(e.target.value.toLowerCase())};
 $('mx2').onclick=()=>dl(('final_pending_tids_'+lvl+'_'+name+'_'+S.scope+'_'+S.date+'_'+s.t).replace(/[^\w\-]+/g,'_'),[['TID','RM','AM','Hub','Partner','Date'],...cf])}
function render(){filters();nav();body()}
S.date=dates[dates.length-1];S.si=snapsOf(S.date).length-1;render();

</script></body></html>
